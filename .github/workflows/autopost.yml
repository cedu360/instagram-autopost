# Robô de postagem. Cada horário abaixo publica os tipos indicados, pegando o próximo item aprovado da fila (queue.json).
# Horários em UTC: Brasília = UTC-3 (09:37 em Brasília é "37 12" aqui). Para mudar, edite as linhas "cron" e o "case".
name: autopost
on:
  schedule:
    - cron: "37 12 * * *" # 09:37 Brasília: foto + story
    - cron: "47 14 * * *" # 11:47 Brasília: reel
    - cron: "7 17 * * *"  # 14:07 Brasília: foto + story
    - cron: "47 19 * * *" # 16:47 Brasília: reel
    - cron: "37 22 * * *" # 19:37 Brasília: foto + story
  workflow_dispatch:
    inputs:
      tipos:
        description: "Tipos para publicar agora (ex.: FEED,STORIES ou REELS). Vazio = tudo que estiver vencido na fila"
        required: false
      teste:
        description: "Só mostrar o que sairia (não publica)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: autopost
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TZ_OFFSET_MIN: ${{ vars.TZ_OFFSET_MIN || '-180' }}
          SCHEDULE: ${{ github.event.schedule }}
          TIPOS_MANUAL: ${{ inputs.tipos }}
          TESTE: ${{ inputs.teste && '--dry-run' || '' }}
        run: |
          [ -n "$IG_TOKEN" ] || { echo "Falta o segredo IG_TOKEN (Settings > Secrets and variables > Actions). Nada publicado."; exit 0; }
          case "$SCHEDULE" in
            "47 14 * * *"|"47 19 * * *") TIPOS=REELS ;;
            "") TIPOS="$TIPOS_MANUAL" ;;
            *) TIPOS=FEED,STORIES ;;
          esac
          if [ -n "$TIPOS" ]; then node publish.mjs --types "$TIPOS" $TESTE; else node publish.mjs $TESTE; fi
      - name: Guardar o que já saiu (state.json)
        if: always()
        run: |
          git config user.name "autopost"; git config user.email "autopost@users.noreply.github.com"
          git add state.json 2>/dev/null && git commit -m "autopost: estado [skip ci]" && git pull --rebase -q && git push || true
